[project]
name = "news2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "dependency-injector>=4.49.1",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.139.0",
    "pydantic-settings>=2.14.2",
    "scrapling>=0.4.11",
    "sqlalchemy[asyncio]>=2.0.51",
    "structlog>=26.1.0",
    "websockets>=16.0,<17.0",
    "yfinance>=1.5.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pre-commit>=4.6.0",
    "pyrefly>=1.1.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.20",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.pyrefly]
preset = "basic"
project_excludes = ["test.ipynb"]
